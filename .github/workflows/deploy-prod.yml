name: Deploy to Production (GCP)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
  GCP_ZONE: ${{ vars.GCP_ZONE || 'southamerica-east1-a' }}

jobs:
  # ===========================================================================
  # 1. INFRAESTRUTURA COMO CÓDIGO (TERRAFORM)
  # ===========================================================================
  terraform-apply:
    name: Provisionar Infraestrutura (Terraform)
    runs-on: ubuntu-latest
    outputs:
      artifact_registry_repo: ${{ steps.tf_outputs.outputs.artifact_registry_repo }}
      gke_cluster_name: ${{ steps.tf_outputs.outputs.gke_cluster_name }}
      frontend_bucket_name: ${{ steps.tf_outputs.outputs.frontend_bucket_name }}
      frontend_url: ${{ steps.tf_outputs.outputs.frontend_url }}
      cloud_sql_private_ip: ${{ steps.tf_outputs.outputs.cloud_sql_private_ip }}
      redis_host: ${{ steps.tf_outputs.outputs.redis_host }}
      redis_port: ${{ steps.tf_outputs.outputs.redis_port }}
      cloud_sql_user: ${{ steps.tf_outputs.outputs.cloud_sql_user }}
      secret_db_password_id: ${{ steps.tf_outputs.outputs.secret_db_password_id }}
      secret_jwt_id: ${{ steps.tf_outputs.outputs.secret_jwt_id }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Habilitar APIs Essenciais do Google Cloud
        run: |
          echo "Habilitando APIs fundamentais no GCP..."
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            iam.googleapis.com \
            compute.googleapis.com \
            container.googleapis.com \
            sqladmin.googleapis.com \
            redis.googleapis.com \
            servicenetworking.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Inicializar Backend Remoto no Cloud Storage & Terraform Init
        working-directory: infra
        run: |
          echo "Garantindo existencia do bucket de estado no GCS..."
          gcloud storage buckets create "gs://${{ env.GCP_PROJECT_ID }}-tfstate" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --location="${{ env.GCP_REGION }}" \
            --uniform-bucket-level-access 2>/dev/null || true

          gcloud storage buckets update "gs://${{ env.GCP_PROJECT_ID }}-tfstate" --versioning 2>/dev/null || true

          echo "Inicializando Terraform com Backend GCS..."
          terraform init \
            -backend-config="bucket=${{ env.GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=ufgpay/prod"

      - name: Sincronizar Recursos Existentes no State
        working-directory: infra
        run: |
          PROJECT="${{ env.GCP_PROJECT_ID }}"
          REGION="${{ env.GCP_REGION }}"
          TF_VARS="-var=project_id=$PROJECT -var=region=$REGION -var=zone=${{ env.GCP_ZONE }} -var=environment=prod -var=db_deletion_protection=false"

          import_if_missing() {
            local res="$1"
            local id="$2"
            if ! terraform state list 2>/dev/null | grep -q "^${res}$"; then
              echo "Importando $res ($id)..."
              terraform import $TF_VARS "$res" "$id" 2>/dev/null || true
            else
              echo "$res ja esta no state."
            fi
          }

          # Rede e Subnets
          import_if_missing "google_compute_network.vpc" "projects/$PROJECT/global/networks/ufgpay-prod-vpc"
          import_if_missing "google_compute_subnetwork.subnet" "projects/$PROJECT/regions/$REGION/subnetworks/ufgpay-prod-subnet-$REGION"
          import_if_missing "google_compute_router.router" "projects/$PROJECT/regions/$REGION/routers/ufgpay-prod-nat-router"
          import_if_missing "google_compute_router_nat.nat" "projects/$PROJECT/regions/$REGION/routers/ufgpay-prod-nat-router/ufgpay-prod-nat-gateway"
          import_if_missing "google_compute_global_address.private_ip_alloc" "projects/$PROJECT/global/addresses/ufgpay-prod-private-ip-alloc"
          import_if_missing "google_compute_firewall.allow_internal" "projects/$PROJECT/global/firewalls/ufgpay-prod-allow-internal"
          import_if_missing "google_compute_firewall.allow_health_checks" "projects/$PROJECT/global/firewalls/ufgpay-prod-allow-health-checks"

          # Frontend CDN e Load Balancer
          import_if_missing "google_storage_bucket.frontend" "ufgpay-prod-frontend-static-$PROJECT"
          import_if_missing "google_compute_global_address.frontend_ip" "projects/$PROJECT/global/addresses/ufgpay-prod-frontend-global-ip"
          import_if_missing "google_compute_backend_bucket.frontend_cdn" "projects/$PROJECT/global/backendBuckets/ufgpay-prod-frontend-backend-bucket"
          import_if_missing "google_compute_url_map.frontend_url_map" "projects/$PROJECT/global/urlMaps/ufgpay-prod-frontend-url-map"
          import_if_missing "google_compute_target_http_proxy.frontend_http_proxy" "projects/$PROJECT/global/targetHttpProxies/ufgpay-prod-frontend-http-proxy"
          import_if_missing "google_compute_global_forwarding_rule.frontend_http_rule" "projects/$PROJECT/global/forwardingRules/ufgpay-prod-frontend-http-forwarding-rule"

          # Cloud SQL PostgreSQL 17 e Bancos
          import_if_missing "google_sql_database_instance.postgres" "projects/$PROJECT/instances/ufgpay-prod-postgres17"
          import_if_missing "google_sql_database.user_db" "projects/$PROJECT/instances/ufgpay-prod-postgres17/databases/ufg_user_db"
          import_if_missing "google_sql_database.wallet_db" "projects/$PROJECT/instances/ufgpay-prod-postgres17/databases/ufg_wallet_db"
          import_if_missing "google_sql_database.campus_db" "projects/$PROJECT/instances/ufgpay-prod-postgres17/databases/ufg_campus_db"
          import_if_missing "google_sql_user.app_user" "projects/$PROJECT/instances/ufgpay-prod-postgres17/users/ufgpay_app//"

          # Artifact Registry
          import_if_missing "google_artifact_registry_repository.docker_repo" "projects/$PROJECT/locations/$REGION/repositories/ufgpay-prod-docker-repo"

          # Service Accounts
          import_if_missing "google_service_account.gke_sa" "projects/$PROJECT/serviceAccounts/ufgpay-prod-gke-sa@$PROJECT.iam.gserviceaccount.com"
          import_if_missing "google_service_account.app_sa" "projects/$PROJECT/serviceAccounts/ufgpay-prod-app-sa@$PROJECT.iam.gserviceaccount.com"

          # Secrets
          import_if_missing "google_secret_manager_secret.db_password" "projects/$PROJECT/secrets/ufgpay-prod-db-password"
          import_if_missing "google_secret_manager_secret.jwt_secret" "projects/$PROJECT/secrets/ufgpay-prod-jwt-secret"

          # Redis e GKE Cluster
          import_if_missing "google_redis_instance.cache" "projects/$PROJECT/locations/$REGION/instances/ufgpay-prod-redis"
          import_if_missing "google_container_cluster.primary" "projects/$PROJECT/locations/$REGION/clusters/ufgpay-prod-gke-cluster"

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="zone=${{ env.GCP_ZONE }}" \
            -var="environment=prod" \
            -var="db_deletion_protection=false"

      - name: Capturar Outputs do Terraform
        id: tf_outputs
        working-directory: infra
        run: |
          echo "artifact_registry_repo=$(terraform output -raw artifact_registry_repo)" >> "$GITHUB_OUTPUT"
          echo "gke_cluster_name=$(terraform output -raw gke_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          echo "cloud_sql_private_ip=$(terraform output -raw cloud_sql_private_ip)" >> "$GITHUB_OUTPUT"
          echo "redis_host=$(terraform output -raw redis_host)" >> "$GITHUB_OUTPUT"
          echo "redis_port=$(terraform output -raw redis_port)" >> "$GITHUB_OUTPUT"
          echo "cloud_sql_user=$(terraform output -raw cloud_sql_user)" >> "$GITHUB_OUTPUT"
          echo "secret_db_password_id=$(terraform output -raw secret_db_password_id)" >> "$GITHUB_OUTPUT"
          echo "secret_jwt_id=$(terraform output -raw secret_jwt_id)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # 2. BUILD E DEPLOY DOS MICROSSERVIÇOS (BACKEND GKE)
  # ===========================================================================
  deploy-backend:
    name: Build & Deploy Backend (GKE)
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Instalar gke-gcloud-auth-plugin & Kubectl
        run: |
          gcloud components install gke-gcloud-auth-plugin kubectl --quiet

      - name: Autenticar Docker no Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push das Imagens Docker
        env:
          OUTPUT_REPO: ${{ needs.terraform-apply.outputs.artifact_registry_repo }}
          SHA: ${{ github.sha }}
        run: |
          REPO="${OUTPUT_REPO:-${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/ufgpay-prod-docker-repo}"
          echo "Utilizando Repositorio Docker: $REPO"

          # 1. UserService
          docker build -t "$REPO/user-service:$SHA" -t "$REPO/user-service:latest" -f app/backend/services/UfgPay.UserService/Dockerfile .
          docker push "$REPO/user-service:$SHA"
          docker push "$REPO/user-service:latest"

          # 2. WalletService
          docker build -t "$REPO/wallet-service:$SHA" -t "$REPO/wallet-service:latest" -f app/backend/services/UfgPay.WalletService/Dockerfile .
          docker push "$REPO/wallet-service:$SHA"
          docker push "$REPO/wallet-service:latest"

          # 3. CampusService
          docker build -t "$REPO/campus-service:$SHA" -t "$REPO/campus-service:latest" -f app/backend/services/UfgPay.CampusService/Dockerfile .
          docker push "$REPO/campus-service:$SHA"
          docker push "$REPO/campus-service:latest"

          # 4. API Gateway
          docker build -t "$REPO/gateway:$SHA" -t "$REPO/gateway:latest" -f app/backend/gateway/UfgPay.Gateway/Dockerfile .
          docker push "$REPO/gateway:$SHA"
          docker push "$REPO/gateway:latest"

      - name: Conectar ao Cluster GKE
        env:
          CLUSTER: ${{ needs.terraform-apply.outputs.gke_cluster_name }}
        run: |
          GKE_NAME="${CLUSTER:-ufgpay-prod-gke-cluster}"
          echo "Conectando ao cluster GKE: $GKE_NAME"
          gcloud container clusters get-credentials "$GKE_NAME" \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Obter Segredos do Secret Manager
        id: secrets
        run: |
          DB_PASS=$(gcloud secrets versions access latest --secret="ufgpay-prod-db-password" --project=${{ env.GCP_PROJECT_ID }})
          JWT_SEC=$(gcloud secrets versions access latest --secret="ufgpay-prod-jwt-secret" --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT_SEC"
          echo "db_pass=$DB_PASS" >> "$GITHUB_OUTPUT"
          echo "jwt_sec=$JWT_SEC" >> "$GITHUB_OUTPUT"

      - name: Aplicar Namespace e ConfigMap
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/configmap.yaml

      - name: Configurar Kubernetes Secrets
        env:
          SQL_IP: ${{ needs.terraform-apply.outputs.cloud_sql_private_ip }}
          REDIS_IP: ${{ needs.terraform-apply.outputs.redis_host }}
          REDIS_P: ${{ needs.terraform-apply.outputs.redis_port }}
          DB_PASS: ${{ steps.secrets.outputs.db_pass }}
          JWT_SEC: ${{ steps.secrets.outputs.jwt_sec }}
        run: |
          DB_HOST="${SQL_IP:-$(gcloud sql instances describe ufgpay-prod-postgres17 --project=${{ env.GCP_PROJECT_ID }} --format='value(ipAddresses.filter(type:PRIVATE).ipAddress)')}"
          REDIS_HOST="${REDIS_IP:-$(gcloud redis instances describe ufgpay-prod-redis --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format='value(host)')}"
          REDIS_PORT="${REDIS_P:-6379}"
          DB_USER="ufgpay_app"

          echo "Configurando secrets com DB_HOST=$DB_HOST e REDIS_HOST=$REDIS_HOST"

          kubectl create secret generic ufgpay-db-secrets \
            --namespace ufgpay \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASS" \
            --from-literal=USER_DB_CONNECTION="Host=$DB_HOST;Port=5432;Database=ufg_user_db;Username=$DB_USER;Password=$DB_PASS" \
            --from-literal=WALLET_DB_CONNECTION="Host=$DB_HOST;Port=5432;Database=ufg_wallet_db;Username=$DB_USER;Password=$DB_PASS" \
            --from-literal=CAMPUS_DB_CONNECTION="Host=$DB_HOST;Port=5432;Database=ufg_campus_db;Username=$DB_USER;Password=$DB_PASS" \
            --from-literal=REDIS_CONNECTION="$REDIS_HOST:$REDIS_PORT" \
            --from-literal=JWT_SECRET="$JWT_SEC" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Executar Migrations e Seed nos Bancos Postgres
        run: |
          # Deleta job anterior se existir e cria novo job de migration
          kubectl delete job ufgpay-db-migration-job -n ufgpay --ignore-not-found
          kubectl apply -f infra/k8s/db-init-job.yaml
          kubectl wait --for=condition=complete --timeout=120s job/ufgpay-db-migration-job -n ufgpay

      - name: Atualizar Imagens e Aplicar Deployments K8s
        env:
          OUTPUT_REPO: ${{ needs.terraform-apply.outputs.artifact_registry_repo }}
          SHA: ${{ github.sha }}
        run: |
          REPO="${OUTPUT_REPO:-${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/ufgpay-prod-docker-repo}"
          # Substitui a tag da imagem nos manifestos
          sed -i "s|REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME|$REPO|g" infra/k8s/*.yaml
          sed -i "s|IMAGE_TAG|$SHA|g" infra/k8s/*.yaml

          kubectl apply -f infra/k8s/user-service.yaml
          kubectl apply -f infra/k8s/wallet-service.yaml
          kubectl apply -f infra/k8s/campus-service.yaml
          kubectl apply -f infra/k8s/gateway.yaml
          kubectl apply -f infra/k8s/ingress.yaml

      - name: Validar Rollout dos Microsserviços
        run: |
          kubectl rollout status deployment/ufgpay-user-service -n ufgpay --timeout=300s
          kubectl rollout status deployment/ufgpay-wallet-service -n ufgpay --timeout=300s
          kubectl rollout status deployment/ufgpay-campus-service -n ufgpay --timeout=300s
          kubectl rollout status deployment/ufgpay-gateway -n ufgpay --timeout=300s

  # ===========================================================================
  # 3. BUILD E DEPLOY DO FRONTEND (CLOUD STORAGE + CLOUD CDN)
  # ===========================================================================
  deploy-frontend:
    name: Build & Deploy Frontend (Cloud Storage + CDN)
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências e Compilar Angular (Produção)
        working-directory: app/frontend/ufg-pay-web
        run: |
          npm install
          npm run build -- --configuration production

      - name: Sincronizar Arquivos no Google Cloud Storage Bucket
        env:
          OUT_BUCKET: ${{ needs.terraform-apply.outputs.frontend_bucket_name }}
        run: |
          BUCKET_NAME="${OUT_BUCKET:-ufgpay-prod-frontend-static-${{ env.GCP_PROJECT_ID }}}"
          echo "Publicando no bucket: gs://$BUCKET_NAME"
          if [ -d "app/frontend/ufg-pay-web/dist/ufg-pay-web/browser" ]; then
            SRC_DIR="app/frontend/ufg-pay-web/dist/ufg-pay-web/browser"
          else
            SRC_DIR="app/frontend/ufg-pay-web/dist/ufg-pay-web"
          fi
          echo "Diretório de origem: $SRC_DIR"
          gcloud storage cp -r "$SRC_DIR/*" "gs://$BUCKET_NAME/"

      - name: Invalidar Cache da Google Cloud CDN
        run: |
          echo "Invalidando cache CDN para propagação global instantânea..."
          gcloud compute url-maps invalidate-cdn-cache ufgpay-prod-frontend-url-map \
            --path="/*" \
            --project=${{ env.GCP_PROJECT_ID }} \
            --async

      - name: URL de Produção do Frontend
        run: |
          echo "=========================================================="
          echo "🚀 Frontend publicado com sucesso na Google Cloud CDN!"
          echo "🌐 Endereço Público: ${{ needs.terraform-apply.outputs.frontend_url }}"
          echo "=========================================================="
