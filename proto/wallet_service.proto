syntax = "proto3";

package ufgpay.wallet;

option csharp_namespace = "UfgPay.WalletService.Grpc";

// Serviço gRPC de Gestão da Carteira e Operações Financeiras
service WalletGrpcService {
  rpc CreateAccount (CreateAccountRequest) returns (WalletOperationResponse);
  rpc GetBalance (GetBalanceRequest) returns (BalanceResponse);
  rpc DepositPix (DepositPixRequest) returns (WalletOperationResponse);
  rpc DebitBalance (DebitBalanceRequest) returns (WalletOperationResponse);
}

message CreateAccountRequest {
  string user_id = 1;
}

message GetBalanceRequest {
  string user_id = 1;
}

message BalanceResponse {
  string user_id = 1;
  int64 saldo_centavos = 2;
  bool bloqueada = 3;
}

message DepositPixRequest {
  string user_id = 1;
  int64 valor_centavos = 2;
  string chave_transacao = 3;
}

message DebitBalanceRequest {
  string user_id = 1;
  int64 valor_centavos = 2;
  string descricao = 3;
}

message WalletOperationResponse {
  bool sucesso = 1;
  string mensagem = 2;
  int64 novo_saldo_centavos = 3;
  string transacao_id = 4;
}
