apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufgpay-campus-service
  namespace: ufgpay
  labels:
    app: ufgpay-campus-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ufgpay-campus-service
  template:
    metadata:
      labels:
        app: ufgpay-campus-service
    spec:
      containers:
        - name: campus-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/campus-service:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: grpc
          env:
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: ufgpay-config
                  key: ASPNETCORE_URLS_CAMPUS
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: ufgpay-db-secrets
                  key: CAMPUS_DB_CONNECTION
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ufgpay-campus-service
  namespace: ufgpay
  labels:
    app: ufgpay-campus-service
spec:
  type: ClusterIP
  ports:
    - port: 5003
      targetPort: 5003
      name: grpc
      appProtocol: grpc
  selector:
    app: ufgpay-campus-service
