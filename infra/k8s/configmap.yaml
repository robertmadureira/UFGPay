apiVersion: v1
kind: ConfigMap
metadata:
  name: ufgpay-config
  namespace: ufgpay
data:
  # URLs gRPC internas na rede do Kubernetes
  SERVICES_USER_SERVICE: "http://ufgpay-user-service.ufgpay.svc.cluster.local:5001"
  SERVICES_WALLET_SERVICE: "http://ufgpay-wallet-service.ufgpay.svc.cluster.local:5002"
  SERVICES_CAMPUS_SERVICE: "http://ufgpay-campus-service.ufgpay.svc.cluster.local:5003"
  
  # Portas de Escuta
  ASPNETCORE_URLS_USER: "http://+:5001"
  ASPNETCORE_URLS_WALLET: "http://+:5002"
  ASPNETCORE_URLS_CAMPUS: "http://+:5003"
  ASPNETCORE_URLS_GATEWAY: "http://+:5000"
