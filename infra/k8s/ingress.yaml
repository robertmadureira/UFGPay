apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ufgpay-gateway-ingress
  namespace: ufgpay
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: ufgpay-gateway
      port:
        number: 5000
  rules:
    - http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: ufgpay-gateway
                port:
                  number: 5000
