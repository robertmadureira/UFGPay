<header class="navbar-wrapper">
  <div class="container navbar-content">
    <a routerLink="/" class="navbar-brand">
      <div class="brand-badge">UFG</div>
      <span class="brand-title">Pay</span>
    </a>

    <nav class="navbar-nav">
      @if (authService.isAuthenticated()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Início</a>
        <a routerLink="/campus" routerLinkActive="active" class="nav-link">Serviços do Campus</a>
        <a routerLink="/pix" routerLinkActive="active" class="nav-link">Recarga Pix</a>

        <div class="user-pill">
          <div class="user-info">
            <span class="user-name">{{ authService.currentUser()?.nome || 'Usuário' }}</span>
            <span class="user-balance">{{ walletService.balance()?.saldoReais || 0 | brlCurrency }}</span>
          </div>
          <button class="btn-logout" (click)="onLogout()" title="Sair do sistema">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      } @else {
        <a routerLink="/auth/login" class="btn btn-outline">Entrar</a>
        <a routerLink="/auth/register" class="btn btn-primary">Cadastrar</a>
      }
    </nav>
  </div>
</header>
