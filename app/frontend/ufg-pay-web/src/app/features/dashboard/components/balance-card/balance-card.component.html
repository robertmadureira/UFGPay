<div class="balance-card-container">
  <div class="card-top">
    <div class="card-brand">
      <span class="ufg-pill">UFG Pay Card</span>
      <span class="status-badge" [class.blocked]="bloqueada">
        {{ bloqueada ? 'Conta Bloqueada' : 'Ativa' }}
      </span>
    </div>
    <span class="user-greeting">Olá, {{ userName || 'Aluno(a)' }}</span>
  </div>

  <div class="card-middle">
    <span class="balance-label">Saldo Disponível</span>
    <h1 class="balance-amount">{{ saldoReais | brlCurrency }}</h1>
  </div>

  <div class="card-bottom">
    <div class="card-actions">
      <a routerLink="/pix" class="btn btn-accent btn-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Recarregar com PIX
      </a>
      <a routerLink="/campus" class="btn btn-primary btn-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Comprar no RU / Campus
      </a>
    </div>
  </div>
</div>
